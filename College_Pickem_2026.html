<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>College Pick'em 2026</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#111827}main{max-width:900px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{margin:0;font-size:28px}h2{margin-top:0}.card{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #00000010}.hero{background:linear-gradient(135deg,#111827,#374151);color:white}.game{border:1px solid #e5e7eb;border-radius:14px;padding:15px;margin:12px 0}.gamehead{display:flex;justify-content:space-between;font-weight:700}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.team{padding:14px;border:2px solid #e5e7eb;border-radius:12px;background:white;font-weight:700;cursor:pointer}.team.selected{border-color:#111827;background:#f0f1f3}.scores{display:flex;gap:10px;margin-top:10px}.scores input,input{padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:11px 15px;background:#111827;color:white;font-weight:700;cursor:pointer}.submit{margin-top:12px;width:100%}.muted{color:#6b7280}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #374151}.friend{display:inline-flex;gap:8px;align-items:center;margin:8px 8px 0 0;padding:8px 12px;background:#eef0f2;border-radius:20px}.rank{font-size:20px;font-weight:800} @media(max-width:600px){.teams{grid-template-columns:1fr}header{align-items:flex-start;gap:10px}}</style></head>
<body><main>
<header><div><h1>🏈 College Pick'em 2026</h1><p>Free-to-play season league • Points only</p></div>
<button onclick="resetAll()">Reset</button></header>
<section class="card hero"><h2>Season Leaderboard</h2><div id="leaderboard"></div></section>
<section class="card"><h2>Make Your Picks</h2><p class="muted">Choose a winner and enter your predicted score. Picks are for fun and do not use money.</p>
<div id="games"></div></section>
<section class="card"><h2>Add Friends</h2><input id="friendName" placeholder="Friend name"><button onclick="addFriend()">Add Friend</button><div id="friends"></div></section>
</main><script>const games=[["Week 1", "Sep 3", "Arkansas-Pine Bluff", "Missouri"], ["Week 1", "Sep 3", "Idaho", "Utah"], ["Week 1", "Sep 4", "UTEP", "Oklahoma"], ["Week 1", "Sep 4", "Miami (FL)", "Stanford"], ["Week 1", "Sep 4", "Fresno State", "USC"], ["Week 1", "Sep 5", "East Carolina", "Alabama"], ["Week 1", "Sep 5", "North Texas", "Indiana"], ["Week 1", "Sep 5", "Ball State", "Ohio State"], ["Week 1", "Sep 5", "Tennessee State", "Georgia"], ["Week 1", "Sep 5", "Boise State", "Oregon"], ["Week 1", "Sep 5", "Texas State", "Texas"], ["Week 1", "Sep 5", "Clemson", "LSU"], ["Week 1", "Sep 6", "Wisconsin", "Notre Dame"], ["Week 1", "Sep 6", "Louisville", "Ole Miss"], ["Week 2", "Sep 12", "Arizona State", "Texas A&M"], ["Week 2", "Sep 12", "Alabama", "Kentucky"], ["Week 2", "Sep 12", "Ohio State", "Texas"], ["Week 3", "Sep 19", "Georgia", "Arkansas"], ["Week 3", "Sep 19", "Florida State", "Alabama"], ["Week 3", "Sep 19", "LSU", "Ole Miss"]];
let state=JSON.parse(localStorage.getItem('pickem2026')||'null')||{friends:['You'],picks:{},points:{You:0}};
function save(){localStorage.setItem('pickem2026',JSON.stringify(state));render();}
function addFriend(){let n=document.getElementById('friendName').value.trim();if(n&&!state.friends.includes(n)){state.friends.push(n);state.points[n]=0;document.getElementById('friendName').value='';save()}}
function pick(i,t){state.picks[i]=t;render()}
function submit(i){let s1=+document.getElementById('s1-'+i).value,s2=+document.getElementById('s2-'+i).value;if(!state.picks[i]||Number.isNaN(s1)||Number.isNaN(s2))return alert('Choose a team and enter both scores.');state.picks[i].score=[s1,s2];save();alert('Pick saved!')}
function render(){let g=document.getElementById('games');g.innerHTML='';let last='';games.forEach((x,i)=>{if(x[0]!=last){g.innerHTML+=`<h3>${x[0]}</h3>`;last=x[0]}let p=state.picks[i]||{};g.innerHTML+=`<div class="game"><div class="gamehead"><span>${x[1]}</span><span>10 pts</span></div><div class="teams"><button class="team ${p.team===x[2]?'selected':''}" onclick="pick(${i},'${x[2].replace(/'/g,"\\'")}')">${x[2]}</button><button class="team ${p.team===x[3]?'selected':''}" onclick="pick(${i},'${x[3].replace(/'/g,"\\'")}')">${x[3]}</button></div><div class="scores"><input id="s1-${i}" type="number" min="0" placeholder="${x[2]} score" value="${p.score?p.score[0]:''}"><input id="s2-${i}" type="number" min="0" placeholder="${x[3]} score" value="${p.score?p.score[1]:''}"></div><button class="submit" onclick="submit(${i})">Save Pick</button></div>`});renderFriends();renderBoard()}
function renderFriends(){document.getElementById('friends').innerHTML=state.friends.map(n=>`<span class="friend">${n}</span>`).join('')}
function renderBoard(){let rows=state.friends.map(n=>[n,state.points[n]||0]).sort((a,b)=>b[1]-a[1]);document.getElementById('leaderboard').innerHTML=rows.map((r,i)=>`<div class="row"><span class="rank">${i+1}. ${r[0]}</span><b>${r[1]} pts</b></div>`).join('')}
function resetAll(){if(confirm('Reset all picks and friends?')){localStorage.removeItem('pickem2026');location.reload()}}
render();</script></body></html>
